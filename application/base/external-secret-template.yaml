apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: shared-microservice-secret-bridge
  namespace: data-tier
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-secretsmanager-backend
    kind: ClusterSecretStore
  target:
    name: application-runtime-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      engineVersion: v2
  data:
    - secretKey: JWT_SIGNING_KEY
      remoteRef:
        key: production/security/tokens
        property: jwt_key
    - secretKey: ENCRYPTION_SALT
      remoteRef:
        key: production/security/tokens
        property: salt
