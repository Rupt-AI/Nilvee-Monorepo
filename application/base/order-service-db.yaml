apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: orders-database
  namespace: orders-domain
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:16.1
  postgresql:
    parameters:
      shared_buffers: "128MB"
      max_connections: "100"
  storage:
    size: 50Gi
    storageClassName: premium-rwo
  monitoring:
    enablePodMonitor: true
  backup:
    barmanObjectStore:
      destinationPath: "s3://enterprise-prod-app-assets-bucket/db-backups/orders/"
      region: us-east-1
      wal:
        compression: gzip
      s3Credentials:
        inheritFromServiceAccount: true
