apiVersion: apps/v1
kind: Deployment
metadata:
  name: stateless-token-auth
  namespace: security-auth-domain
  labels:
    app: auth-engine
    tier: compute
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: auth-engine
  template:
    metadata:
      labels:
        app: auth-engine
    spec:
      containers:
        - name: application
          image: internal-registry.io/auth-app:latest
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: corporate-global-runtime-properties
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 250m
              memory: 64Mi
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: auth-engine-service
  namespace: security-auth-domain
spec:
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: auth-engine
