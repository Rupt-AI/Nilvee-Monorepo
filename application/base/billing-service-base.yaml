apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-transaction-manager
  namespace: billing-domain
  labels:
    app: billing-manager
    tier: compute
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app: billing-manager
  template:
    metadata:
      labels:
        app: billing-manager
    spec:
      containers:
        - name: application
          image: internal-registry.io/billing-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: corporate-global-runtime-properties
          env:
            - name: REDIS_URL
              value: "redis://billing-redis-service.billing-domain.svc.cluster.local:6379/0"
            - name: MAX_POOL_SIZE
              value: "150"
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 500m
              memory: 256Mi
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: billing-manager-service
  namespace: billing-domain
spec:
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: billing-manager
