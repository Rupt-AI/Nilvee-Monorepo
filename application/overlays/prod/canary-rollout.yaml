apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: prod-billing-async-worker
  namespace: billing-domain
spec:
  replicas: 5
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: billing-worker
  template:
    metadata:
      labels:
        app: billing-worker
    spec:
      serviceAccountName: billing-worker-sa
      containers:
        - name: job-consumer
          image: internal-registry.io/billing-worker:latest
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              cpu: "2"
              memory: 1Gi
            requests:
              cpu: "1"
              memory: 512Mi
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
  strategy:
    canary:
      trafficRouting:
        gateway:
          httpRouteName: prod-canary-web-route
      steps:
        - setWeight: 10
        - pause: { duration: 10m }
        - setWeight: 50
        - pause: { duration: 5m }
