apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: prod-catalog-search-engine
  namespace: catalog-domain
spec:
  replicas: 5
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: catalog-search
  template:
    metadata:
      labels:
        app: catalog-search
    spec:
      containers:
        - name: application
          image: internal-registry.io/catalog-app:latest
          ports:
            - containerPort: 8080
              name: http
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: "500m"
              memory: 256Mi
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
  strategy:
    canary:
      trafficRouting:
        gateway:
          httpRouteName: prod-canary-web-route
      analysis:
        templates:
          - templateName: corporate-success-rate-validator
        args:
          - name: service-name
            value: catalog-search
      steps:
        - setWeight: 10
        - pause: { duration: 5m }
        - setWeight: 50
        - pause: { duration: 5m }
