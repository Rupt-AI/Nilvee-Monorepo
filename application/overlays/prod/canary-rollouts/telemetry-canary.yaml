apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: prod-metrics-collector-hub
  namespace: telemetry-domain
spec:
  replicas: 3
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: metrics-collector
  template:
    metadata:
      labels:
        app: metrics-collector
    spec:
      containers:
        - name: application
          image: internal-registry.io/telemetry-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          resources:
            limits:
              cpu: "2"
              memory: 1Gi
            requests:
              cpu: "1"
              memory: 512Mi
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
  strategy:
    canary:
      trafficRouting:
        gateway:
          httpRouteName: prod-canary-web-route
      # ==============================================================================
      # REMEDIATION: AUTOMATED BACKGROUND ANALYSIS LOOP (Enables Auto-Rollback Engine)
      # ==============================================================================
      analysis:
        templates:
          - templateName: corporate-success-rate-validator # Links straight to your global judge file
        args:
          - name: service-name
            value: metrics-collector # Passes its unique service name directly into the PromQL filter
      steps:
        - setWeight: 10
        - pause: { duration: 10m } # Real-time analysis runs every 60s throughout this window
        - setWeight: 50
        - pause: { duration: 5m }

