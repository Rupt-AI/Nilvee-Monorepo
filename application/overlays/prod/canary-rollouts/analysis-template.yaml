apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: corporate-success-rate-validator
  namespace: infra-production
spec:
  metrics:
    - name: http-success-rate
      interval: 1m
      successCondition: result < 0.01
      failureLimit: 2
      provider:
        prometheus:
          address: http://cluster.local
          query: |
            sum(rate(http_requests_total{status=~"5..", job="prod-{{args.service-name}}"}[2m]))
            /
            sum(rate(http_requests_total{job="prod-{{args.service-name}}"}[2m]))
