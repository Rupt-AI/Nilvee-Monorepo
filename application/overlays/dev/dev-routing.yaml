apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dev-local-routing-wire
  namespace: security-auth-domain
spec:
  parentRefs:
    - name: corporate-edge-gateway
      namespace: kube-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /auth
      backendRefs:
        - name: dev-stateless-token-auth
          port: 8080
