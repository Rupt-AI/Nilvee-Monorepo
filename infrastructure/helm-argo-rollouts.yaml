apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-rollouts-controller
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.io'
    chart: argo-rollouts
    targetRevision: 2.38.0
    helm:
      releaseName: argo-rollouts
      valuesInline:
        dashboard:
          enabled: false
        installCRDs: true
  destination:
    server: 'https://default.svc'
    namespace: argo-rollouts
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
