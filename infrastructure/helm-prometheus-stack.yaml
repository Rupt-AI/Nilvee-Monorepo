apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: corporate-prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.io'
    chart: kube-prometheus-stack
    targetRevision: 61.3.0
    helm:
      releaseName: cluster-monitoring
      valuesFiles:
        - alertmanager-values.yaml
  destination:
    server: 'https://default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
