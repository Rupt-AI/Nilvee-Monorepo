apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production-vault
spec:
  acme:
    server: https://letsencrypt.org
    email: site-reliability-engineering@yourcompany.com
    privateKeySecretRef:
      name: letsencrypt-production-account-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: corporate-edge-gateway
                namespace: kube-system
