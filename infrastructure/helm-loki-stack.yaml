apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki-log-aggregation-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.io'
    chart: loki-stack
    targetRevision: 2.10.2
    helm:
      releaseName: loki-stack
      valuesInline:
        loki:
          persistence:
            enabled: true
            storageClassName: premium-rwo
            size: 100Gi
          config:
            table_manager:
              retention_deletes_enabled: true
              retention_period: 30d
        promtail:
          enabled: true
  destination:
    server: 'https://default.svc'
    namespace: logging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
