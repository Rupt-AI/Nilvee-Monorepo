apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: influxdb-operator
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://influxdata.com'
    chart: influxdb-operator
    targetRevision: 0.1.2
    helm:
      releaseName: influxdb-operator
  destination:
    server: 'https://default.svc'
    namespace: data-tier
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
