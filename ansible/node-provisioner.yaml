---
- name: Harden and Configure Production Linux Nodes
  hosts: kubernetes_nodes
  become: true
  gather_facts: true

  tasks:
    - name: Ensure OS Security Packages Are Up To Date
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        cache_valid_time: 3600

    - name: Disable Linux Swap System
      ansible.builtin.command: swapoff -a
      when: ansible_swaptotal_mb > 0
      changed_when: true

    - name: Permanently Remove Swap Configurations From Storage Settings
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*?\sswap\s+.*)$'
        replace: '# \1'

    - name: Configure Kernel Parameters for Container Bridging
      ansible.posix.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        sysctl_file: /etc/sysctl.d/99-kubernetes-cri.conf
        reload: true
      loop:
        - { name: "net.bridge.bridge-nf-call-iptables", value: "1" }
        - { name: "net.ipv4.ip_forward", value: "1" }
        - { name: "net.bridge.bridge-nf-call-ip6tables", value: "1" }

    - name: Install Container Runtime Engine Dependencies
      ansible.builtin.apt:
        name:
          - containerd
          - iptables
        state: present

    - name: Enforce Strict Firewall Rule Defaults
      community.general.ufw:
        state: enabled
        policy: deny
